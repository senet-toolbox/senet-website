<svg id="animated-logo" viewBox="0 0 267 1174" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-animated-logo">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="gradient1-animated-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: var(--gradient_start_0stop_color, #ff005a);" />
      <stop offset="100%" style="stop-color: var(--gradient_start_100stop_color, #ffcc00);" />
    </linearGradient>

    <linearGradient id="gradient2-animated-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: var(--gradient_end_0stop_color, #00f0ff);" />
      <stop offset="100%" style="stop-color: var(--gradient_end_100stop_color, #0080ff);" />
    </linearGradient>
  </defs>

  <style>
    #animated-logo path {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke: url(#gradient1-animated-logo);
      stroke-dasharray: 8000;
      stroke-dashoffset: 8000;
      animation: draw-path-animated-logo 6s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      filter: url(#glow-animated-logo);
    }

    @keyframes draw-path-animated-logo {
      0%   { stroke-dashoffset: 8000; }
      33%  { stroke-dashoffset: 0; }
      75%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 8000; }
    }

    #animated-logo {
      transform-origin: center;
      animation: pulse-animated-logo 6s ease-in-out infinite;
    }

    @keyframes pulse-animated-logo {
      0%, 66.7% { transform: scale(1); }
      70.8% { transform: scale(1.03); }
      72.8% { transform: scale(0.98); }
      75%, 100% { transform: scale(1); }
    }
  </style>

