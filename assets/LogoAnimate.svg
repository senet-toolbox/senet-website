            <svg viewBox="0 0 528 379" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Top right link with rotation and scale animation -->
                <g>
                    <animateTransform
                        attributeName="transform"
                        type="rotate"
                        values="0 489 338;3 489 338;0 489 338;-3 489 338;0 489 338"
                        dur="4s"
                        repeatCount="indefinite"/>
                    <animateTransform
                        attributeName="transform"
                        type="scale"
                        values="1;1.05;1;1.05;1"
                        dur="4s"
                        repeatCount="indefinite"
                        additive="sum"/>
                    <path d="M461.476 368.124L398.86 308.458C410.272 302.742 420.984 295.314 430.58 286.17C440.176 277.026 447.972 266.818 453.971 255.944L516.586 315.61C531.805 330.111 531.804 353.623 516.586 368.124C501.369 382.625 476.694 382.626 461.476 368.124Z" fill="#2c3e50">
                        <animate attributeName="fill" values="#000000" dur="8s" repeatCount="indefinite"/>
                    </path>
                </g>
                
                <!-- Main center connecting piece with pulsing animation -->
                <g>
                    <animateTransform
                        attributeName="transform"
                        type="scale"
                        values="1;1.03;1"
                        dur="3s"
                        repeatCount="indefinite"/>
                    <path d="M170.056 214.559C154.837 200.057 154.838 176.545 170.056 162.044C185.274 147.543 209.948 147.543 225.167 162.044L290.715 224.505C311.698 244.499 345.719 244.499 366.702 224.505C387.685 204.51 387.685 172.093 366.702 152.098L281.906 71.2982C328.525 54.6994 383.072 64.2597 420.56 99.9817C471.749 148.76 471.749 227.844 420.56 276.622C369.929 324.867 288.181 325.394 236.872 278.199L236.857 278.213L170.056 214.559Z" fill="#34495e">
                        <animate attributeName="fill" values="#000000" dur="6s" repeatCount="indefinite"/>
                        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
                    </path>
                </g>
                
                <!-- Main left connecting piece with reverse rotation -->
                <g>
                    <animateTransform
                        attributeName="transform"
                        type="rotate"
                        values="0 235 184;-2 235 184;0 235 184;2 235 184;0 235 184"
                        dur="3.5s"
                        repeatCount="indefinite"/>
                    <animateTransform
                        attributeName="transform"
                        type="scale"
                        values="1;1.08;1"
                        dur="3.5s"
                        repeatCount="indefinite"
                        additive="sum"/>
                    <path d="M300.318 214.559L236.857 154.088C215.874 134.093 181.854 134.093 160.871 154.088C139.888 174.082 139.888 206.5 160.871 226.494L245.666 307.295C199.047 323.893 144.501 314.333 107.013 278.611C55.8232 229.833 55.824 150.748 107.013 101.971C158.201 53.1941 241.196 53.1933 292.386 101.971L355.429 162.044C370.647 176.546 370.647 200.058 355.429 214.559C340.211 229.06 315.536 229.06 300.318 214.559Z" fill="#2c3e50">
                        <animate attributeName="fill" values="#000000" dur="7s" repeatCount="indefinite"/>
                    </path>
                </g>
                
                <!-- Bottom left link with floating animation -->
                <g>
                    <animateTransform
                        attributeName="transform"
                        type="translate"
                        values="0 0;0 -3;0 0;0 3;0 0"
                        dur="3s"
                        repeatCount="indefinite"/>
                    <animateTransform
                        attributeName="transform"
                        type="rotate"
                        values="0 39 37;4 39 37;0 39 37;-4 39 37;0 39 37"
                        dur="4s"
                        repeatCount="indefinite"
                        additive="sum"/>
                    <animateTransform
                        attributeName="transform"
                        type="scale"
                        values="1;1.06;1"
                        dur="3s"
                        repeatCount="indefinite"
                        additive="sum"/>
                    <path d="M66.5244 10.8759C51.306 -3.62559 26.6314 -3.62501 11.4136 10.8759C-3.80422 25.3767 -3.80483 48.8889 11.4136 63.3904L74.0293 123.056C80.0283 112.182 87.8238 101.974 97.4199 92.8304C107.016 83.6863 117.728 76.2581 129.14 70.5417L66.5244 10.8759Z" fill="#2c3e50">
                        <animate attributeName="fill" values="#000000" dur="5s" repeatCount="indefinite"/>
                    </path>
                </g>
                
                <!-- Background glow effect -->
                <defs>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge> 
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    
                    <filter id="dropShadow">
                        <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                    </filter>
                </defs>

                <!-- Animated background circle for extra visual interest -->
                <circle cx="264" cy="189" r="120" fill="none" stroke="#ecf0f1" stroke-width="2" opacity="0.3">
                    <animate attributeName="r" values="120;140;120" dur="6s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
                </circle>
                
                <circle cx="264" cy="189" r="80" fill="none" stroke="#bdc3c7" stroke-width="1" opacity="0.2">
                    <animate attributeName="r" values="80;100;80" dur="5s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="rotate" values="0 264 189;360 264 189" dur="20s" repeatCount="indefinite"/>
                </circle>

                <!-- Apply filters to all paths -->
                <style>
                    path {
                        filter: url(#dropShadow);
                    }
                </style>
            </svg>
